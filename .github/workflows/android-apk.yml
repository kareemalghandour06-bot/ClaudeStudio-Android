name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Build Debug & Release Signed APK
        run: gradle assembleRelease assembleDebug --no-daemon
      - name: Upload ClaudeStudio-Android.apk
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeStudio-Android-APK
          path: app/build/outputs/apk/release/app-release.apk

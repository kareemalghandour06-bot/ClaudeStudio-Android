plugins {
    id 'com.android.application'
}

android {
    namespace 'com.claudestudio.xpiki'
    compileSdk 34

    defaultConfig {
        applicationId "com.claudestudio.xpiki"
        minSdk 24
        targetSdk 34
        versionCode 110
        versionName "1.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix ""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
